# LUMASHA Smart — déploiement local/hôte persistant avec base SQLite.
#
#   docker compose up -d --build
#   → http://localhost:3000
#
# Les données (data/lumasha.db) vivent dans le volume nommé `lumasha-data`
# et survivent aux redémarrages et redéploiements.
services:
  lumasha:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_WA_NUMBER: ${NEXT_PUBLIC_WA_NUMBER:-+22893628030}
        NEXT_PUBLIC_STAND: ${NEXT_PUBLIC_STAND:-AR114}
    image: lumasha-smart
    container_name: lumasha-smart
    ports:
      - "3000:3000"
    environment:
      LUMASHA_DB_PATH: /app/data/lumasha.db
      # Passerelle hybride : publie l'instantané vers Supabase (facultatif).
      LUMASHA_BACKEND: ${LUMASHA_BACKEND:-sqlite}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - lumasha-data:/app/data
    restart: unless-stopped

volumes:
  lumasha-data:
